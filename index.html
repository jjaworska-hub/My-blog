<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mononoke Translations · モノノ怪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..400&family=Archivo:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="frame">
  <header>
    <a class="about-link" id="aboutBtn" href="#">ABOUT / 概要</a>
    <h1 class="logo"><span class="jp">モノノ怪</span><span class="en">MONONOKE<br>TRANSLATIONS</span></h1>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" class="on">EN</button><button data-lang="pl">PL</button>
    </div>
  </header>

  <main id="shelfView">
    <nav class="filters" id="filters" aria-label="Filter"></nav>
    <div class="shelf" id="shelf" tabindex="0" aria-label="Book shelf"><div class="track" id="track"></div></div>
    <section class="info" id="info">
      <h2 id="title"></h2>
      <p class="jp-title" id="jpTitle"></p>
      <p class="meta" id="meta"></p>
      <a class="read" id="readBtn" href="#">READ TRANSLATION →</a>
    </section>
    <button class="arrow left" id="prev" aria-label="Previous">←</button>
    <button class="arrow right" id="next" aria-label="Next">→</button>
  </main>

  <main id="readerView" hidden>
    <button class="back" id="backBtn">← BACK / 戻る</button>
    <article id="reader" class="reader"></article>
  </main>

  <div class="curtain" id="curtain"></div>
  <footer><span>© ALL TRANSLATIONS ARE FAN WORKS</span><span id="counter"></span></footer>
</div>
<script src="data/books.js"></script>
<script src="js/app.js"></script>
</body>
</html>
